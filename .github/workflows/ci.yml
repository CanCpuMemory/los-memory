name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run targeted Ruff checks on maintained surfaces
        run: |
          ruff check \
            --select F,B \
            memory_tool/cli.py \
            memory_tool/doctor.py \
            memory_tool/sessions.py \
            memory_tool/client.py \
            memory_tool/checkpoints.py \
            memory_tool/hub_lite.py \
            memory_tool/operations.py \
            memory_tool/analytics.py \
            memory_tool/projects.py \
            memory_tool/feedback.py \
            memory_tool/links.py \
            scripts/create_hub_lite_records.py \
            scripts/create_lsclaw_records.py \
            scripts/cross_repo_reporter.py \
            scripts/validate_ledger_boundary.py \
            scripts/check_docs_cli_commands.py \
            tests/cli/test_cli_contract.py \
            tests/cli/test_cli_basic.py \
            tests/unit/test_doctor.py \
            tests/unit/test_hub_lite.py \
            tests/unit/test_hub_lite_record_script.py \
            tests/unit/test_cross_repo_reporter.py \
            tests/unit/test_ledger_boundary.py \
            tests/unit/test_lsclaw_records.py \
            tests/unit/test_docs_command_lint.py \
            tests/unit/test_docs_current_state.py \
            tests/unit/test_docs_layout.py \
            tests/unit/test_config.py \
            tests/unit/test_core_compat.py

  docs-command-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"
      - name: Lint command examples in docs
        run: python scripts/check_docs_cli_commands.py

  cli-contract-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run CLI contract tests
        run: |
          pytest tests/cli -m contract -q

  unit-and-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          pytest tests/unit -m "not e2e" -q
      - name: Run lsclaw integration smoke
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/integration/test_lsclaw_smoke.py -q

  approval-migration-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"
      - name: Run approval migration e2e
        run: |
          pytest tests/integration/test_approval_migration_e2e.py -m e2e -q

  hub-lite-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"
      - name: Run hub-lite integration tests
        run: |
          pytest tests/integration/test_hub_lite_integration.py -m hub_lite -q

  bdd-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"
      - name: Run BDD smoke
        run: |
          pytest tests/test_tool_memory_bdd.py -q
