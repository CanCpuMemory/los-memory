name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-command-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"
      - name: Lint command examples in docs
        run: python scripts/check_docs_cli_commands.py

  cli-contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"
      - name: Run CLI contract tests
        run: |
          pytest tests/cli -m contract -q

  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: |
          pytest tests/unit -m "not e2e" -q
      - name: Run lsclaw integration smoke
        run: |
          pytest tests/integration/test_lsclaw_smoke.py -q

  approval-migration-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"
      - name: Run approval migration e2e
        run: |
          pytest tests/integration/test_approval_migration_e2e.py -m e2e -q

  bdd-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"
      - name: Run BDD smoke
        run: |
          pytest tests/test_tool_memory_bdd.py -q
